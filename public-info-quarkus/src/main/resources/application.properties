# -- Kafka Outgoing (producers) ------------------------------------------------

# -- Kafka Outgoing: доменные события (create/update/delete) ------------------
# downstream потребители: history-service, audit-service
mp.messaging.outgoing.bank-events-out.connector=smallrye-kafka
mp.messaging.outgoing.bank-events-out.topic=public-info.bank.events
mp.messaging.outgoing.bank-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.branch-events-out.connector=smallrye-kafka
mp.messaging.outgoing.branch-events-out.topic=public-info.branch.events
mp.messaging.outgoing.branch-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.atm-events-out.connector=smallrye-kafka
mp.messaging.outgoing.atm-events-out.topic=public-info.atm.events
