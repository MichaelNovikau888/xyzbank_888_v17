quarkus.application.name=public-info-service
quarkus.http.port=8095

# -- DataSource ----------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postgres}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# -- Hibernate ORM -------------------------------------------------------------
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# -- Liquibase -----------------------------------------------------------------
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.liquibase.default-schema-name=public_info

# -- Kafka (SmallRye Reactive Messaging) ---------------------------------------
# Note for IDEA: "Unused property" on mp.messaging.* is a false positive.
# Channels are bound to @Incoming("channel-name") by name at runtime.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# BankDetails channels
mp.messaging.incoming.bank-create.connector=smallrye-kafka
mp.messaging.incoming.bank-create.topic=public-info.bank.create
mp.messaging.incoming.bank-create.group.id=public-info-bank-group
mp.messaging.incoming.bank-create.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.bank-update.connector=smallrye-kafka
mp.messaging.incoming.bank-update.topic=public-info.bank.update
mp.messaging.incoming.bank-update.group.id=public-info-bank-group
mp.messaging.incoming.bank-update.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.bank-delete.connector=smallrye-kafka
mp.messaging.incoming.bank-delete.topic=public-info.bank.delete
mp.messaging.incoming.bank-delete.group.id=public-info-bank-group
mp.messaging.incoming.bank-delete.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

