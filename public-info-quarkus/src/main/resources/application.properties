mp.messaging.outgoing.error-out.topic=public-info.error-logs
mp.messaging.outgoing.error-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# -- OpenAPI / Swagger UI ------------------------------------------------------
quarkus.smallrye-openapi.info-title=Public Info Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

# -- Logging -------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.bank.publicinfo".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# -- Test profile (H2 in-memory, Liquibase off) --------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.liquibase.enabled=false
# Kafka channels replaced with smallrye-in-memory in tests (no broker required)
%test.mp.messaging.incoming.bank-create.connector=smallrye-in-memory
%test.mp.messaging.incoming.bank-update.connector=smallrye-in-memory
%test.mp.messaging.incoming.bank-delete.connector=smallrye-in-memory
%test.mp.messaging.incoming.branch-create.connector=smallrye-in-memory
%test.mp.messaging.incoming.branch-update.connector=smallrye-in-memory
%test.mp.messaging.incoming.branch-delete.connector=smallrye-in-memory
