%test.mp.messaging.incoming.atm-update.connector=smallrye-in-memory
%test.mp.messaging.incoming.atm-delete.connector=smallrye-in-memory
%test.mp.messaging.incoming.certificate-create.connector=smallrye-in-memory
%test.mp.messaging.incoming.certificate-update.connector=smallrye-in-memory
%test.mp.messaging.incoming.certificate-delete.connector=smallrye-in-memory
%test.mp.messaging.incoming.license-create.connector=smallrye-in-memory
