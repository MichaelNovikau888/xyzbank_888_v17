# -- Test profile --------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.replica.db-kind=h2
%test.quarkus.datasource.replica.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.liquibase.enabled=false
%test.mp.messaging.incoming.payment-created.connector=smallrye-in-memory
%test.mp.messaging.incoming.payment-status-changed.connector=smallrye-in-memory
%test.mp.messaging.incoming.transfer-notification.connector=smallrye-in-memory

# Отключаем планировщик в тест-профиле (H2 не поддерживает pg_tables / PARTITION OF)
%test.quarkus.scheduler.enabled=false

# Отключаем JWT-авторизацию в тест-профиле (тесты не генерируют реальные токены)
%test.app.jwt.auth-enabled=false
