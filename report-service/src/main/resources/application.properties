quarkus.application.name=report-service
quarkus.http.port=8083

# -- PostgreSQL primary --------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postgres}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.default-schema=report
quarkus.hibernate-orm.log.sql=false

# -- PostgreSQL replica (read-only: CSV-генерация) ----------------------------
quarkus.datasource.replica.db-kind=postgresql
quarkus.datasource.replica.username=${DB_USERNAME:postgres}
quarkus.datasource.replica.password=${DB_PASSWORD:password}
quarkus.datasource.replica.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_REPLICA_PORT:5434}/${DB_NAME:postgres}
quarkus.datasource.replica.jdbc.max-size=10
quarkus.datasource.replica.jdbc.min-size=2

# -- Liquibase -----------------------------------------------------------------
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.liquibase.default-schema-name=report

# -- Kafka: Bootstrap ----------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ─── Exactly-Once Delivery ───────────────────────────────────────────────────
#
# Стратегия: read_committed isolation + idempotent producer + transactional consumer.
#
# 1. isolation.level=read_committed:
#    Consumer читает только committed сообщения.
#    Uncommitted сообщения от transactional producer игнорируются.
#    Это предотвращает чтение "грязных" данных при сбоях.
#
# 2. enable.auto.commit=false + processing.guarantee=exactly_once_beta:
#    Offset коммитится только после успешного COMMIT транзакции PostgreSQL.
#    При сбое между чтением и коммитом — offset не продвигается,
#    сообщение перечитывается, но уникальный индекс kafka_idempotent_offset
#    или payment_id отклонит дубль.
#
# 3. На стороне продюсера (payment-api / transfer-service):
#    enable.idempotence=true + transactional.id обеспечивают
#    ровно-однажды запись в Kafka-топик.
# ─────────────────────────────────────────────────────────────────────────────

# payment.created consumer
mp.messaging.incoming.payment-created.connector=smallrye-kafka
mp.messaging.incoming.payment-created.topic=payment.created
mp.messaging.incoming.payment-created.group.id=report-service-payments
mp.messaging.incoming.payment-created.auto.offset.reset=earliest
mp.messaging.incoming.payment-created.enable.auto.commit=false
mp.messaging.incoming.payment-created.isolation.level=read_committed
mp.messaging.incoming.payment-created.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer
mp.messaging.incoming.payment-created.value.deserializer.type=com.bank.report.event.PaymentCreatedEvent

# payment.status.changed consumer
mp.messaging.incoming.payment-status-changed.connector=smallrye-kafka
mp.messaging.incoming.payment-status-changed.topic=payment.status.changed
mp.messaging.incoming.payment-status-changed.group.id=report-service-status
mp.messaging.incoming.payment-status-changed.auto.offset.reset=earliest
mp.messaging.incoming.payment-status-changed.enable.auto.commit=false
mp.messaging.incoming.payment-status-changed.isolation.level=read_committed
mp.messaging.incoming.payment-status-changed.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer
mp.messaging.incoming.payment-status-changed.value.deserializer.type=com.bank.report.event.PaymentStatusChangedEvent

# transfer.notification consumer (НОВЫЙ)
mp.messaging.incoming.transfer-notification.connector=smallrye-kafka
mp.messaging.incoming.transfer-notification.topic=transfer.notification
mp.messaging.incoming.transfer-notification.group.id=report-service-transfers
mp.messaging.incoming.transfer-notification.auto.offset.reset=earliest
mp.messaging.incoming.transfer-notification.enable.auto.commit=false
mp.messaging.incoming.transfer-notification.isolation.level=read_committed
mp.messaging.incoming.transfer-notification.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer
mp.messaging.incoming.transfer-notification.value.deserializer.type=com.bank.report.event.TransferNotificationEvent

# -- OpenAPI -------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi

# -- Logging -------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.bank.report".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

