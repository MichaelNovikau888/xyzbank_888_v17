databaseChangeLog:
  - changeSet:
      id: create-credit-card-table
      author: xyz-bank
      changes:
        - createTable:
            tableName: credit_card
            schemaName: account
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: credit_card_pkey

              - column:
                  name: card_number
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: credit_card_card_number_key

              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: cardholder_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: cvv_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: card_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE

              - column:
                  name: daily_limit
                  type: DECIMAL(20, 2)
                  defaultValue: 100000.00

              - column:
                  name: monthly_limit
                  type: DECIMAL(20, 2)
                  defaultValue: 1000000.00

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: credit_card
            baseTableSchemaName: account
            baseColumnNames: account_id
            referencedTableName: account_details
            referencedTableSchemaName: account
            referencedColumnNames: id
            constraintName: fk_credit_card_account
            onDelete: CASCADE

        - createIndex:
            indexName: idx_credit_card_card_number
            tableName: credit_card
            schemaName: account
            columns:
              - column:
                  name: card_number

        - createIndex:
            indexName: idx_credit_card_account_id
            tableName: credit_card
            schemaName: account
            columns:
              - column:
                  name: account_id

      rollback:
        - dropTable:
            tableName: credit_card
            schemaName: account
