# Test settings -- real values are injected via @DynamicPropertySource
# Liquibase applies changelog-001.xml + create-outbox-events.xml to the test DB
spring.liquibase.enabled=true
spring.liquibase.change-log=db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
# Spring Data JDBC -- show SQL in tests for debugging
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.bank.antifraud=DEBUG
logging.level.org.testcontainers=INFO
