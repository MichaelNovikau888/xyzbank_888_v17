server:
  port: 8092
  servlet:
    context-path: /api/transfer
  error:
    whitelabel:
      enabled: false
management:
  server:
    port: 8191
    base-path: /actuator
  endpoints:
    web:
      exposure:
        include: '*'
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
spring:
  config:
    activate:
      on-profile: kubernetes
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://bank-db:5432/postgres?currentSchema=transfer}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: transfer
        format_sql: true
  liquibase:
    default-schema: transfer
    change-log: db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false
  application:
    name: transfer-app
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service-1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transfer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      trusted-packages: com.bank.transfer.dto
    consumer-groups:
      transfer: transfer-group
      audit: audit-group
  cloud:
    kubernetes:
      discovery:
        enabled: true
      config:
        enabled: true
      reload:
        enabled: true
logging:
  level:
    com.bank.transfer: INFO
    org.apache.kafka: INFO
    root: INFO
    liquibase: INFO
    org.springframework.jdbc.datasource.init: INFO
    org.springframework.boot.autoconfigure: INFO
  file:
    name: transfer.log
    path: logs
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
topics:
  transfer-account: transfer.account
  transfer-card: transfer.card
  transfer-phone: transfer.phone
  error-logs: error.logs
  audit-logs: audit.logs