<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Pay - Нагрузочное тестирование</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }

        .log-success {
            border-left-color: #28a745;
            background: rgba(40, 167, 69, 0.1);
        }

        .log-error {
            border-left-color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ Fast Pay - Нагрузочное тестирование</h1>
    <p class="subtitle">Система для тестирования микросервисов платежей</p>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="totalRequests">0</div>
            <div class="stat-label">Всего запросов</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="successRequests">0</div>
            <div class="stat-label">Успешных</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="failedRequests">0</div>
            <div class="stat-label">Ошибок</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="currentRPS">0</div>
            <div class="stat-label">RPS</div>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressBar">0%</div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>🎯 Одиночный платёж</h3>
            <div class="input-group">
                <label>Client ID</label>
                <input type="text" id="clientId" value="CLIENT_123" />
            </div>
            <div class="input-group">
                <label>Счёт получателя (20 цифр)</label>
                <input type="text" id="recipientAccount" value="40817810099910004312" />
            </div>
            <div class="input-group">
                <label>Сумма</label>
                <input type="number" id="amount" value="10000" />
            </div>
            <div class="input-group">
                <label>Валюта</label>
                <select id="currency">
                    <option value="RUB">RUB</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>
            </div>
            <button class="btn-primary" onclick="sendSinglePayment()">Отправить платёж</button>
        </div>

        <div class="card">
            <h3>🚀 Нагрузочное тестирование</h3>
            <div class="input-group">
                <label>Количество платежей</label>
                <input type="number" id="loadCount" value="100" />
            </div>
            <div class="input-group">
                <label>Целевой RPS</label>
                <input type="number" id="targetRPS" value="100" />
                <small style="color: #6c757d;">В легенде: ~100 RPS в пике</small>
            </div>
            <div class="input-group">
                <label>Задержка между запросами (мс)</label>
                <input type="number" id="delayMs" value="10" readonly />
            </div>
            <button class="btn-primary" onclick="startLoadTest()">Запустить нагрузку</button>
            <button class="btn-danger" onclick="stopLoadTest()" style="margin-top: 10px;">Остановить</button>
        </div>
    </div>

    <div class="card">
        <h3>📊 Лог запросов</h3>
        <div class="log" id="log">
            <div class="log-entry">Система готова к тестированию...</div>
        </div>
    </div>
</div>

<script>
    let totalRequests = 0;
    let successRequests = 0;
    let failedRequests = 0;
    let isRunning = false;
    let startTime = null;

    // Обновление delay при изменении RPS
    document.getElementById('targetRPS').addEventListener('input', function() {
        const rps = parseInt(this.value);
        const delayMs = Math.floor(1000 / rps);
        document.getElementById('delayMs').value = delayMs;
    });

    function generateIdempotencyKey() {
        return 'idem_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    function log(message, type = 'info') {
        const logDiv = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : ''}`;
        const timestamp = new Date().toLocaleTimeString();
        entry.textContent = `[${timestamp}] ${message}`;
        logDiv.insertBefore(entry, logDiv.firstChild);

        // Ограничиваем количество записей
        while (logDiv.children.length > 50) {
            logDiv.removeChild(logDiv.lastChild);
        }
    }

    function updateStats() {
        document.getElementById('totalRequests').textContent = totalRequests;
        document.getElementById('successRequests').textContent = successRequests;
        document.getElementById('failedRequests').textContent = failedRequests;

        if (startTime) {
            const elapsed = (Date.now() - startTime) / 1000;
            const rps = Math.round(totalRequests / elapsed);
            document.getElementById('currentRPS').textContent = rps;
        }
    }

    async function sendSinglePayment() {
        const clientId = document.getElementById('clientId').value;
        const recipientAccount = document.getElementById('recipientAccount').value;
        const amount = document.getElementById('amount').value;
        const currency = document.getElementById('currency').value;

        try {
            const response = await fetch('http://localhost:8081/api/v1/payments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Client-Id': clientId,
                    'Idempotency-Key': generateIdempotencyKey()
                },
                body: JSON.stringify({
                    recipientAccount: recipientAccount,
                    amount: parseFloat(amount),
                    currency: currency,
                    description: 'Тестовый платёж'
                })
            });

            totalRequests++;

            if (response.ok) {
                const data = await response.json();
                successRequests++;
                log(`✅ Платёж создан: ID=${data.id}, Сумма=${data.amount} ${data.currency}`, 'success');
            } else {
                failedRequests++;
                log(`❌ Ошибка ${response.status}: ${await response.text()}`, 'error');
            }
        } catch (error) {
            failedRequests++;
            log(`❌ Сетевая ошибка: ${error.message}`, 'error');
        }

        updateStats();
    }

    async function startLoadTest() {
        if (isRunning) {
            log('⚠️ Нагрузка уже запущена', 'error');
            return;
        }

        isRunning = true;
        startTime = Date.now();
        totalRequests = 0;
        successRequests = 0;
        failedRequests = 0;

        const count = parseInt(document.getElementById('loadCount').value);
        const delayMs = parseInt(document.getElementById('delayMs').value);

        log(`🚀 Запуск нагрузочного теста: ${count} платежей с delay=${delayMs}ms`, 'success');

        for (let i = 0; i < count && isRunning; i++) {
            const clientId = `CLIENT_${Math.floor(Math.random() * 1000)}`;
            const amount = Math.floor(Math.random() * 100000) + 1000;

            fetch('http://localhost:8081/api/v1/payments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Client-Id': clientId,
                    'Idempotency-Key': generateIdempotencyKey()
                },
                body: JSON.stringify({
                    recipientAccount: '40817810099910004312',
                    amount: amount,
                    currency: 'RUB',
                    description: 'Load test'
                })
            })
                .then(response => {
                    totalRequests++;
                    if (response.ok) {
                        successRequests++;
                    } else {
                        failedRequests++;
                    }
                    updateStats();

                    // Обновляем прогресс-бар
                    const progress = Math.round((i + 1) / count * 100);
                    document.getElementById('progressBar').style.width = progress + '%';
                    document.getElementById('progressBar').textContent = progress + '%';
                })
                .catch(error => {
                    totalRequests++;
                    failedRequests++;
                    updateStats();
                });

            await new Promise(resolve => setTimeout(resolve, delayMs));
        }

        if (isRunning) {
            log(`✅ Нагрузочный тест завершён: ${totalRequests} запросов`, 'success');
            isRunning = false;
        }
    }

    function stopLoadTest() {
        if (isRunning) {
            isRunning = false;
            log('⛔ Нагрузочный тест остановлен', 'error');
        }
    }
</script>
</body>
</html>
