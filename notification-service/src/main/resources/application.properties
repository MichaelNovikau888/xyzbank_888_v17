# -- PostgreSQL (shared DB, schema: notification) ------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postgres}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.default-schema=notification
quarkus.hibernate-orm.log.sql=false

# -- Liquibase -----------------------------------------------------------------
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.liquibase.default-schema-name=notification

# -- Test profile --------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.liquibase.enabled=false

quarkus.application.name=notification-service
quarkus.http.port=8082


# -- Redis ---------------------------------------------------------------------
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.redis.timeout=2s

# -- Kafka ---------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# payment.created → handlePaymentCreated
mp.messaging.incoming.payment-created.connector=smallrye-kafka
mp.messaging.incoming.payment-created.topic=payment.created
mp.messaging.incoming.payment-created.group.id=notification-service-created
mp.messaging.incoming.payment-created.auto.offset.reset=earliest
mp.messaging.incoming.payment-created.enable.auto.commit=false
mp.messaging.incoming.payment-created.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-created.dead-letter-queue.topic=payment.created.dlq

# payment.status.changed → handlePaymentStatusChanged
mp.messaging.incoming.payment-status-changed.connector=smallrye-kafka
mp.messaging.incoming.payment-status-changed.topic=payment.status.changed
mp.messaging.incoming.payment-status-changed.group.id=notification-service-status
mp.messaging.incoming.payment-status-changed.auto.offset.reset=earliest
mp.messaging.incoming.payment-status-changed.enable.auto.commit=false

# transfer.notification → handleTransferNotification (НОВЫЙ)
mp.messaging.incoming.transfer-notification.connector=smallrye-kafka
mp.messaging.incoming.transfer-notification.topic=transfer.notification
mp.messaging.incoming.transfer-notification.group.id=notification-service-transfer
mp.messaging.incoming.transfer-notification.auto.offset.reset=earliest
mp.messaging.incoming.transfer-notification.enable.auto.commit=false
mp.messaging.incoming.transfer-notification.failure-strategy=dead-letter-queue
mp.messaging.incoming.transfer-notification.dead-letter-queue.topic=transfer.notification.dlq
# Jackson десериализует TransferNotificationEvent автоматически
mp.messaging.incoming.transfer-notification.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# -- FCM (Firebase Cloud Messaging) -------------------------------------------
quarkus.rest-client.fcm-api.url=${FCM_URL:https://fcm.googleapis.com}
fcm.server-key=${FCM_SERVER_KEY:test-key}

# -- Mailer (MailHog dev) ------------------------------------------------------
quarkus.mailer.mock=false
quarkus.mailer.from=noreply@xyz-bank.ru
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}

# -- OpenAPI / Swagger ---------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi

# -- Logging -------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.bank.notification".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# -- Test profile --------------------------------------------------------------
%test.quarkus.mailer.mock=true
%test.quarkus.rest-client.fcm-api.url=http://localhost:9999

# ── Карточные события (card.created / card.blocked / card.unblocked / card.limit.changed) ──
# Все четыре топика объединены в один канал через topics (comma-separated список).
mp.messaging.incoming.card-events.connector=smallrye-kafka
mp.messaging.incoming.card-events.topics=card.created,card.blocked,card.unblocked,card.limit.changed
mp.messaging.incoming.card-events.group.id=notification-service-card
mp.messaging.incoming.card-events.auto.offset.reset=earliest
mp.messaging.incoming.card-events.enable.auto.commit=false
mp.messaging.incoming.card-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.card-events.dead-letter-queue.topic=card.events.dlq
mp.messaging.incoming.card-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

%test.mp.messaging.incoming.card-events.connector=smallrye-in-memory

# -- Profile Service REST Client -----------------------------------------------
# notification-service → profile-service: GET /api/profiles/{id} for email lookup
quarkus.rest-client.profile-api.url=${PROFILE_SERVICE_URL:http://localhost:8089}
quarkus.rest-client.profile-api.connect-timeout=1000
quarkus.rest-client.profile-api.read-timeout=2000
# Fallback при недоступности profile-service: ClientService возвращает null
quarkus.rest-client.profile-api.scope=jakarta.inject.Singleton

%test.quarkus.rest-client.profile-api.url=http://localhost:9998

# ── Регистрация пользователей (auth.user.registered) ──────────────────────────
mp.messaging.incoming.auth-user-registered.connector=smallrye-kafka
mp.messaging.incoming.auth-user-registered.topic=auth.user.registered
mp.messaging.incoming.auth-user-registered.group.id=notification-service-registration
mp.messaging.incoming.auth-user-registered.auto.offset.reset=earliest
mp.messaging.incoming.auth-user-registered.enable.auto.commit=false
mp.messaging.incoming.auth-user-registered.failure-strategy=dead-letter-queue
mp.messaging.incoming.auth-user-registered.dead-letter-queue.topic=auth.user.registered.dlq
mp.messaging.incoming.auth-user-registered.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

%test.mp.messaging.incoming.auth-user-registered.connector=smallrye-in-memory
