quarkus.application.name=history-service
quarkus.http.port=8084

# -- PostgreSQL (shared DB, schema: history) -----------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postgres}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.hibernate-orm.database.generation=none
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.liquibase.default-schema-name=history

# -- Kafka (SmallRye Reactive Messaging) ---------------------------------------
# Note for IDEA: "Unused property" warning on mp.messaging.* is a false positive.
# These properties are resolved by SmallRye at runtime via @Incoming("channel-name"),
# not through @ConfigProperty.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# audit.logs -> channel audit-logs-in
mp.messaging.incoming.audit-logs-in.connector=smallrye-kafka
mp.messaging.incoming.audit-logs-in.topic=audit.logs
mp.messaging.incoming.audit-logs-in.group.id=history-audit-group
mp.messaging.incoming.audit-logs-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# transfer.events -> channel transfer-events-in
mp.messaging.incoming.transfer-events-in.connector=smallrye-kafka
mp.messaging.incoming.transfer-events-in.topic=transfer.events
mp.messaging.incoming.transfer-events-in.group.id=history-transfer-group
mp.messaging.incoming.transfer-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# account.events -> channel account-events-in
mp.messaging.incoming.account-events-in.connector=smallrye-kafka
mp.messaging.incoming.account-events-in.topic=account.events
mp.messaging.incoming.account-events-in.group.id=history-account-group
mp.messaging.incoming.account-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# error.logs -> channel error-logs-in
mp.messaging.incoming.error-logs-in.connector=smallrye-kafka
mp.messaging.incoming.error-logs-in.topic=error.logs
mp.messaging.incoming.error-logs-in.group.id=history-error-group
mp.messaging.incoming.error-logs-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# -- Dead Letter Queue ---------------------------------------------------------
# Equivalent of Spring DefaultErrorHandler + DeadLetterPublishingRecoverer.
# On failure the message is forwarded to the DLQ topic.
mp.messaging.incoming.audit-logs-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.audit-logs-in.dead-letter-queue.topic=audit-logs-dlq

mp.messaging.incoming.error-logs-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.error-logs-in.dead-letter-queue.topic=error-logs-dlq

# DLQ consumers
mp.messaging.incoming.audit-logs-dlq.connector=smallrye-kafka
mp.messaging.incoming.audit-logs-dlq.topic=audit-logs-dlq
mp.messaging.incoming.audit-logs-dlq.group.id=history-audit-dlq-group
mp.messaging.incoming.audit-logs-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.error-logs-dlq.connector=smallrye-kafka
mp.messaging.incoming.error-logs-dlq.topic=error-logs-dlq
mp.messaging.incoming.error-logs-dlq.group.id=history-error-dlq-group
mp.messaging.incoming.error-logs-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# -- OpenAPI / Swagger UI ------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi

# -- Logging -------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.bank.history".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# -- Test profile (H2 in-memory, Liquibase off) --------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.liquibase.enabled=false
# Kafka channels replaced with smallrye-in-memory in tests (no broker required)
%test.mp.messaging.incoming.audit-logs-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.transfer-events-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.account-events-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.error-logs-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.audit-logs-dlq.connector=smallrye-in-memory
%test.mp.messaging.incoming.error-logs-dlq.connector=smallrye-in-memory
