# ======================================================================
#  XYZ-Bank -- Infrastructure
#
#  START:   docker-compose up -d
#  STOP:    docker-compose down
#  CLEAN:   docker-compose down -v   (removes all volumes/data)
#
#  After starting infrastructure -- run each service in IntelliJ IDEA.
#  Startup order:
#    1. authorization  :8087  (JWT -- must start first)
#    2. account        :8085
#    3. antifraud      :8086
#    4. history        :8088
#    5. profile        :8089
#    6. transfer       :8092
#    7. payment-api    :8079
#    8. notification-service :8082
#    9. report-service :8083
# ======================================================================
networks:
  xyzbank-net:
    name: xyzbank-net
    driver: bridge
services:
  # -- PostgreSQL -------------------------------------------------------
  # Single shared DB; schemas per service are created via init-schemas.sql
  bank-db:
    image: postgres:15-alpine
    container_name: xyzbank-db
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64
    volumes:
      - bank-db-data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  # -- PostgreSQL Read Replica ( report-service) --
  #  report-service   (generateDailyReportCsv).
  #     bank-db (primary).    streaming WAL.
  bank-db-replica:
    image: postgres:15-alpine
    container_name: xyzbank-db-replica
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      PGUSER: postgres
    command: >
      bash -c "
        until pg_basebackup -h bank-db -p 5432 -U postgres -D /var/lib/postgresql/data -Fp -Xs -P -R 2>/dev/null; do
          echo 'Waiting for primary to be ready...'; sleep 3;
        done
        chmod 700 /var/lib/postgresql/data
        postgres -c max_connections=200 -c shared_buffers=128MB -c hot_standby=on
      "
    volumes:
      - bank-db-replica-data:/var/lib/postgresql/data
    depends_on:
      bank-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
  # -- Redis ------------------------------------------------------------
  #  Email template cache for notification-service (TTL 1h)
  redis:
    image: redis:7-alpine
    container_name: xyzbank-redis
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  # -- Zookeeper --
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: xyzbank-zookeeper
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  # -- Kafka --
  # KAFKA_ADVERTISED_LISTENERS:
  #   DOCKER_INTERNAL -- for containers inside docker-compose (kafka:29092)
  #   DOCKER_EXTERNAL -- for Java services on the host (localhost:9092)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: xyzbank-kafka
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER_INTERNAL:PLAINTEXT,DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: DOCKER_INTERNAL://:29092,DOCKER_EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: DOCKER_INTERNAL://kafka:29092,DOCKER_EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
  # -- Kafdrop - Kafka UI -----------------------------------------------
  # http://localhost:9000 -- browse topics and messages
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: xyzbank-kafdrop
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka
  # -- MailHog - email dev server ---------------------------------------
  # SMTP: localhost:1025  (notification-service sends here)
  # Web UI: http://localhost:8025  (inspect incoming emails)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: xyzbank-mailhog
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "1025:1025"
      - "8025:8025"
  # -- Prometheus -- metrics collection ---------------------------------
  # Web UI: http://localhost:9090
  # Scrape targets: all 9 microservices (see monitoring/prometheus.yml)
  # -- public-info-quarkus :8095 -     (Quarkus) --
  public-info-quarkus:
    build:
      context: ./public-info-quarkus
      dockerfile: src/main/docker/Dockerfile.jvm
    image: xyzbank/public-info-quarkus:latest
    container_name: xyzbank-public-info
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "8095:8095"
      - "8195:8195"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://bank-db:5433/postgres
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - bank-db
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: xyzbank-prometheus
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # -- Grafana -- metrics visualization ---------------------------------
  # Web UI: http://localhost:3000  (admin / admin)
  # Dashboard -  monitoring/grafana/dashboards/
  grafana:
    image: grafana/grafana:10.3.0
    container_name: xyzbank-grafana
    restart: unless-stopped
    networks:
      - xyzbank-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/xyz-bank-business.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
  # -- Kafka Topics Setup -------------------------------------------------------
  # Creates all required topics on first startup.
  # Runs once and exits (restart: on-failure with max 3 attempts).
  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: xyzbank-kafka-setup
    restart: on-failure
    networks:
      - xyzbank-net
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        kafka-topics --bootstrap-server kafka:29092 --list

        echo 'Creating topics...'

        # ── Payment ────────────────────────────────────────────────────────
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.created           --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.status.changed    --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.antifraud.check   --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.antifraud.response --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.created.dlq       --partitions 1 --replication-factor 1

        # ── Transfer ───────────────────────────────────────────────────────
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer.events                --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer.notification          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer.notification.dlq      --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer.antifraud.check       --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer.antifraud.response    --partitions 3 --replication-factor 1

        # ── Account / Card events ──────────────────────────────────────────
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account.events            --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic card.created              --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic card.blocked              --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic card.unblocked            --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic card.limit.changed        --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic card.events.dlq           --partitions 1 --replication-factor 1

        # ── Audit / Errors ─────────────────────────────────────────────────
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic audit.logs                --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic error.logs                --partitions 3 --replication-factor 1

        # ── Suspicious transfers (legacy) ──────────────────────────────────
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic suspicious-transfers.create --partitions 3 --replication-factor 1

        echo 'All topics created successfully.'
        kafka-topics --bootstrap-server kafka:29092 --list
      "

volumes:
  bank-db-data:
  bank-db-replica-data:
  prometheus-data:
  grafana-data:
