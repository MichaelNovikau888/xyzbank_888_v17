quarkus.application.name=profile-service
quarkus.http.port=8094

# -- PostgreSQL (shared DB, schema: profile) -----------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postgres}
quarkus.hibernate-orm.database.generation=none
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.liquibase.default-schema-name=profile

# -- Kafka ---------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# -- Kafka consumers (incoming) ------------------------------------------------
# Profile
mp.messaging.incoming.profile-create-in.connector=smallrye-kafka
mp.messaging.incoming.profile-create-in.topic=${app.kafka.topic.profile.create:profile.create}
mp.messaging.incoming.profile-create-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.profile-create-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

mp.messaging.incoming.profile-update-in.connector=smallrye-kafka
mp.messaging.incoming.profile-update-in.topic=${app.kafka.topic.profile.update:profile.update}
mp.messaging.incoming.profile-update-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.profile-update-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

mp.messaging.incoming.profile-delete-in.connector=smallrye-kafka
mp.messaging.incoming.profile-delete-in.topic=${app.kafka.topic.profile.delete:profile.delete}
mp.messaging.incoming.profile-delete-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.profile-delete-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

mp.messaging.incoming.profile-get-in.connector=smallrye-kafka
mp.messaging.incoming.profile-get-in.topic=${app.kafka.topic.profile.get:profile.get}
mp.messaging.incoming.profile-get-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.profile-get-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

# AccountDetails
mp.messaging.incoming.account-details-create-in.connector=smallrye-kafka
mp.messaging.incoming.account-details-create-in.topic=${app.kafka.topic.account.create:account.details.create}
mp.messaging.incoming.account-details-create-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.account-details-create-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

mp.messaging.incoming.account-details-update-in.connector=smallrye-kafka
mp.messaging.incoming.account-details-update-in.topic=${app.kafka.topic.account.update:account.details.update}
mp.messaging.incoming.account-details-update-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.account-details-update-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

mp.messaging.incoming.account-details-delete-in.connector=smallrye-kafka
mp.messaging.incoming.account-details-delete-in.topic=${app.kafka.topic.account.delete:account.details.delete}
mp.messaging.incoming.account-details-delete-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.account-details-delete-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

mp.messaging.incoming.account-details-get-in.connector=smallrye-kafka
mp.messaging.incoming.account-details-get-in.topic=${app.kafka.topic.account.get:account.details.get}
mp.messaging.incoming.account-details-get-in.group.id=${app.kafka.consumer.group-id:profile-group}
mp.messaging.incoming.account-details-get-in.value.deserializer=io.quarkus.kafka.client.serialization.JsonbDeserializer

# -- Kafka producers (outgoing) ------------------------------------------------
mp.messaging.outgoing.profile-out.connector=smallrye-kafka
mp.messaging.outgoing.profile-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.account-details-out.connector=smallrye-kafka
mp.messaging.outgoing.account-details-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.audit-out.connector=smallrye-kafka
mp.messaging.outgoing.audit-out.topic=${app.kafka.topic.audit:audit.logs}
mp.messaging.outgoing.audit-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.error-out.connector=smallrye-kafka
mp.messaging.outgoing.error-out.topic=${app.kafka.topic.error:error.logs}
mp.messaging.outgoing.error-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

# -- OpenAPI / Swagger ---------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi

# -- Logging -------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.bank.profile".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# -- Test profile --------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.liquibase.enabled=false

# -- Kafka in-memory for tests (no broker required) ----------------------------
%test.mp.messaging.incoming.profile-create-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.profile-update-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.profile-delete-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.profile-get-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.account-details-create-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.account-details-update-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.account-details-delete-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.account-details-get-in.connector=smallrye-in-memory
%test.mp.messaging.outgoing.profile-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.account-details-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.audit-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.error-out.connector=smallrye-in-memory
